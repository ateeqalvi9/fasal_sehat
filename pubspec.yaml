name: fasal_sehat
description: "Offline Crop Disease Detection App for Farmers"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  camera: ^0.12.1
  tflite_flutter: ^0.12.1
  image: ^4.10.1
  sqflite: ^2.4.4+1
  path: ^1.9.1
  path_provider: ^2.1.6
  shared_preferences: ^2.5.6
  provider: ^6.1.5+1
  audioplayers: ^6.8.1
  intl: ^0.20.3
  image_picker: ^1.2.4
  flutter_tts: ^4.2.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_native_splash: ^2.4.8

flutter_native_splash:
  color: "#2E7D32"
  image: assets/images/splash_logo.png
  android: true
  ios: false

flutter:
  generate: true
  uses-material-design: true

  assets:
    - assets/model/
    - assets/data/
    - assets/audio/ur/
    - assets/images/
